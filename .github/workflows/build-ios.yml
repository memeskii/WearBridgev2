name: Build iOS Companion App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios-app/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ios-app/**'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build AncsBridge with xcodebuild
        run: |
          xcodebuild -project ios-app/AncsBridge.xcodeproj \
            -scheme AncsBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Payload into Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AncsBridge.app Payload/
          zip -qr AncsBridge-unsigned.ipa Payload
          ls -lh AncsBridge-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AncsBridge-iOS-unsigned
          path: AncsBridge-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
