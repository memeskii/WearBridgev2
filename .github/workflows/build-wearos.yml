name: Build Wear OS App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wearos-app/**'
      - '.github/workflows/build-wearos.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'wearos-app/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x wearos-app/gradlew

      - name: Build Debug APK
        run: |
          cd wearos-app
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK for Distribution
        run: |
          cp wearos-app/app/build/outputs/apk/debug/app-debug.apk WearBridge-WearOS-v1.2-debug.apk
          cp wearos-app/app/build/outputs/apk/debug/app-debug.apk WearBridge-WearOS-v1.1-debug.apk
          ls -lh WearBridge-WearOS-v1.2-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-WearOS-v1.2-debug
          path: WearBridge-WearOS-v1.2-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Rolling GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          files: |
            WearBridge-WearOS-v1.2-debug.apk
            WearBridge-WearOS-v1.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
