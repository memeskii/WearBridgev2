name: Build Wear OS App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wearos-app/**'
      - '.github/workflows/build-wearos.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'wearos-app/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x wearos-app/gradlew

      - name: Build and test debug APK
        working-directory: wearos-app
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Prepare distribution APKs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WEARBRIDGE_RELEASE_STORE_BASE64: ${{ secrets.WEARBRIDGE_RELEASE_STORE_BASE64 }}
          WEARBRIDGE_RELEASE_STORE_PASSWORD: ${{ secrets.WEARBRIDGE_RELEASE_STORE_PASSWORD }}
          WEARBRIDGE_RELEASE_KEY_ALIAS: ${{ secrets.WEARBRIDGE_RELEASE_KEY_ALIAS }}
          WEARBRIDGE_RELEASE_KEY_PASSWORD: ${{ secrets.WEARBRIDGE_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$WEARBRIDGE_RELEASE_STORE_BASE64" ]; then
            echo "Release signing is unconfigured. Skipping distribution build."
            exit 0
          fi
          export WEARBRIDGE_RELEASE_STORE="$(mktemp)"
          trap 'rm -f "$WEARBRIDGE_RELEASE_STORE"' EXIT
          printf '%s' "$WEARBRIDGE_RELEASE_STORE_BASE64" | base64 --decode > "$WEARBRIDGE_RELEASE_STORE"
          test -n "$WEARBRIDGE_RELEASE_STORE_PASSWORD"
          test -n "$WEARBRIDGE_RELEASE_KEY_ALIAS"
          test -n "$WEARBRIDGE_RELEASE_KEY_PASSWORD"
          (cd wearos-app && ./gradlew assembleRelease --no-daemon)
          cp wearos-app/app/build/outputs/apk/release/app-release.apk WearBridge-WearOS-v2.1.0-release.apk

      - name: Upload Release APK Artifact
        if: hashFiles('WearBridge-WearOS-v2.1.0-release.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-WearOS-v2.1.0-release
          path: WearBridge-WearOS-v2.1.0-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-WearOS-v2.1.0-debug
          path: wearos-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to Rolling GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp wearos-app/app/build/outputs/apk/debug/app-debug.apk WearBridge-WearOS-v2.1.0-debug.apk
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "WearBridge Latest Release" --notes "WearBridge builds."
          fi
          gh release upload latest WearBridge-WearOS-v2.1.0-debug.apk --clobber
          if [ -f WearBridge-WearOS-v2.1.0-release.apk ]; then
            gh release upload latest WearBridge-WearOS-v2.1.0-release.apk --clobber
          fi
