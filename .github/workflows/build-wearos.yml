name: Build Wear OS App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wearos-app/**'
      - '.github/workflows/build-wearos.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'wearos-app/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Wear OS APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x wearos-app/gradlew

      - name: Build Release & Debug APKs
        run: |
          cd wearos-app
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Rename APK for Distribution
        run: |
          cp wearos-app/app/build/outputs/apk/release/app-release.apk WearBridge-WearOS-v2.0.0-release.apk
          cp wearos-app/app/build/outputs/apk/debug/app-debug.apk WearBridge-WearOS-v2.0.0-debug.apk
          ls -lh WearBridge-WearOS-v2.0.0-release.apk WearBridge-WearOS-v2.0.0-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-WearOS-v2.0.0-release
          path: WearBridge-WearOS-v2.0.0-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-WearOS-v2.0.0-debug
          path: WearBridge-WearOS-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APKs to Rolling GitHub Release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest WearBridge-WearOS-v2.0.0-release.apk WearBridge-WearOS-v2.0.0-debug.apk --clobber
          else
            gh release create latest WearBridge-WearOS-v2.0.0-release.apk WearBridge-WearOS-v2.0.0-debug.apk --title "WearBridge Latest Release" --notes "Automated build containing latest Wear OS APK and unsigned iOS IPA."
          fi
